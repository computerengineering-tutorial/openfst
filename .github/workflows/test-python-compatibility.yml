name: Test Python Compatibility (Ubuntu x86_64)

on:
  workflow_dispatch:
    inputs:
      build_selector:
        description: "Python versions to test (e.g. 'cp311-*' or 'cp39-* cp310-* cp311-* cp312-* cp313-*')"
        type: string
        default: "cp39-* cp310-* cp311-* cp312-* cp313-*"
  push:
    branches:
      - main
    paths:
      - "openfst/extensions/python/**"
      - ".github/workflows/test-python-compatibility.yml"
      - "CMakeLists.txt"
      - "openfst/**"
  pull_request:
    branches:
      - main
    paths:
      - "openfst/extensions/python/**"
      - ".github/workflows/test-python-compatibility.yml"
      - "CMakeLists.txt"
      - "openfst/**"

concurrency:
  group: test-py-compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test_linux_x86_64:
    name: Build & Test (Ubuntu x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel>=2.22.0"

      - name: Build & Test wheels via cibuildwheel
        run: python -m cibuildwheel openfst/extensions/python --output-dir wheelhouse
        env:
          CIBW_ARCHS: "x86_64"
          CIBW_BUILD: ${{ github.event.inputs.build_selector || 'cp39-* cp310-* cp311-* cp312-* cp313-*' }}
          CIBW_SKIP: "*musllinux*"
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_BUILD_VERBOSITY: 2
          CIBW_ENVIRONMENT: OPENFST_ROOT_DIR="${{ github.workspace }}" CMAKE_BUILD_PARALLEL_LEVEL="2"
          CIBW_ENVIRONMENT_LINUX: OPENFST_ROOT_DIR="/project" CMAKE_BUILD_PARALLEL_LEVEL="2"

      - name: Upload built test wheels
        uses: actions/upload-artifact@v4
        with:
          name: openfst-py-test-wheels-linux-x86_64
          path: ./wheelhouse/*.whl
          if-no-files-found: error

