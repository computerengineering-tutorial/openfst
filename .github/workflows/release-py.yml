name: Build and Release Wheels (openfst-py)

on:
  workflow_dispatch:
    inputs:
      publish_to_pypi:
        description: "Publish wheels to PyPI"
        type: boolean
        default: false
      tag_name:
        description: "Git tag or Release name (e.g. v0.1.0)"
        type: string
        default: "v0.1.0"
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Build pure source distribution (sdist)
  # -------------------------------------------------------------
  build_sdist:
    name: Build source distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Build sdist
        run: python -m build --sdist openfst/extensions/python --outdir dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: openfst-py-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # -------------------------------------------------------------
  # Build wheels across all OS platforms and CPU architectures
  # -------------------------------------------------------------
  build_wheels:
    name: Wheels on ${{ matrix.os }} (${{ matrix.cibw_archs }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 & 32-bit i686
          - os: ubuntu-latest
            cibw_archs: "x86_64 i686"
            qemu: false

          # Linux aarch64 (ARM64)
          - os: ubuntu-latest
            cibw_archs: "aarch64"
            qemu: true

          # Linux PowerPC (ppc64le) & IBM System z (s390x)
          - os: ubuntu-latest
            cibw_archs: "ppc64le s390x"
            qemu: true

          # macOS Intel (x86_64)
          - os: macos-13
            cibw_archs: "x86_64"
            qemu: false

          # macOS Apple Silicon (arm64 & universal2)
          - os: macos-14
            cibw_archs: "arm64 universal2"
            qemu: false

          # Windows x86_64 (AMD64) & 32-bit (x86)
          - os: windows-latest
            cibw_archs: "AMD64 x86"
            qemu: false

          # Windows ARM64
          - os: windows-latest
            cibw_archs: "ARM64"
            qemu: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Set up QEMU for non-x86 Linux architectures
      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cibuildwheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cibuildwheel>=2.22.0"

      - name: Build wheels via cibuildwheel
        run: python -m cibuildwheel openfst/extensions/python --output-dir wheelhouse
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_BUILD_VERBOSITY: 1
          CIBW_ENVIRONMENT: OPENFST_ROOT_DIR="${{ github.workspace }}"
          CIBW_ENVIRONMENT_LINUX: OPENFST_ROOT_DIR="/project"

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openfst-py-wheels-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  # -------------------------------------------------------------
  # Aggregate all artifacts and publish to GitHub Release & PyPI
  # -------------------------------------------------------------
  release:
    name: Create GitHub Release with Wheels & sdist
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/openfst-py
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openfst-py-*
          path: dist/
          merge-multiple: true

      - name: Display downloaded release packages
        run: |
          ls -la dist/
          echo "Total wheel files: $(ls -1 dist/*.whl 2>/dev/null | wc -l)"
          echo "Total sdist files: $(ls -1 dist/*.tar.gz 2>/dev/null | wc -l)"

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag_name || 'v0.1.0' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release with packages
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "openfst-py ${{ steps.release_tag.outputs.tag }}"
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to PyPI
        if: github.event.inputs.publish_to_pypi == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
